    - message
    type: string
    x-enum-varnames:
    - BridgeTypeNative
    - BridgeTypeToken
    - BridgeTypeMessage
  github_com_bane-labs_bridge-indexer-backend_internal_types.DirectionalInstanceSync:
    properties:
