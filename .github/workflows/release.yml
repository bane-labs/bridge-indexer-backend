name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-w -s -X main.version=${VERSION}"

          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/bridge-indexer-linux-amd64       ./cmd/server
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/bridge-indexer-linux-arm64       ./cmd/server
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/bridge-indexer-darwin-amd64      ./cmd/server
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/bridge-indexer-darwin-arm64      ./cmd/server
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/bridge-indexer-windows-amd64.exe ./cmd/server

          sha256sum dist/* > dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            dist/bridge-indexer-linux-amd64
            dist/bridge-indexer-linux-arm64
            dist/bridge-indexer-darwin-amd64
            dist/bridge-indexer-darwin-arm64
            dist/bridge-indexer-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
